services:
  mongodb:
    image: mongo:7.0
    container_name: collectordata_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      MONGO_INITDB_DATABASE: data_collection
    networks:
      - collectordata_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express
    container_name: detectbike-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - collectordata_network

  minio:
    image: minio/minio:latest
    container_name: collectordata_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Console port
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    networks:
      - collectordata_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: collectordata_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - collectordata_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: collectordata_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - collectordata_network

    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    build: .
    container_name: collectordata_worker
    restart: unless-stopped
    command: python worker.py
    volumes:
      - ./downloads:/app/downloads
      - ./dataset_extracted:/app/dataset_extracted
      - ./pexels_traffic_dataset:/app/pexels_traffic_dataset
      - ./camera_collector_data:/app/camera_collector_data
      - ./camera_collector_config:/app/camera_collector_config
      - ./.env:/app/.env
    environment:
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=data_collection
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PEXEL_API_KEY=${PEXELS_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - collectordata_network

  app:
    build: .
    container_name: collectordata_app
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./downloads:/app/downloads
      - ./dataset_extracted:/app/dataset_extracted
      - ./pexels_traffic_dataset:/app/pexels_traffic_dataset
      - ./camera_collector_data:/app/camera_collector_data
      - ./camera_collector_config:/app/camera_collector_config
      - ./.env:/app/.env
      - ./templates:/app/templates
      - ./static:/app/static
    environment:
      - DB_HOST=mongodb
      - DB_PORT=27017
      - DB_NAME=data_collection
      - DB_USER=
      - DB_PASSWORD=
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - FLASK_DEBUG=True
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_USE_SSL=False
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - collectordata_network

volumes:
  mongodb_data:
  mongodb_config:
  minio_data:

networks:
  collectordata_network:
    driver: bridge